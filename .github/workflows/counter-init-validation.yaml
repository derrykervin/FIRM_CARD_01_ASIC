name: counter-init-validation
on:
  push:
    paths:
      - '.github/workflows/counter-init-validation.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [simulation, synthesis]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install independent HDL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Verify and materialize pinned experimental source
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path,PurePosixPath
          payload=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(payload).hexdigest()=='db1b138c877a25453be28fc56bd43e74aa899108f6d0e90515f0fd2b82d09db4','bundle checksum'
          manifest=json.loads(payload)
          assert manifest['format']==1 and manifest['source_sha']=='507ed7d53feb4d580cd1fda3c91ba047c9dffa27','source identity'
          validated=[];seen=set()
          for record in manifest['files']:
              name=record['path'];path=PurePosixPath(name)
              assert name==path.as_posix() and not path.is_absolute() and '..' not in path.parts,'unsafe path'
              assert name not in seen,'duplicate path'
              allowed=(path.parts[:2]==('experimental','i2c') and len(path.parts)==3 and path.suffix in ('.v','.py')) or name in ('FIRM-SYSTEM-SPECS/tools/atecc608_codec.py', 'FIRM-SYSTEM-SPECS/tools/auth_transcript.py', 'FIRM-SYSTEM-SPECS/tools/proof_signature.py', 'FIRM-SYSTEM-SPECS/tools/protocol.py') or name=='FIRM-SYSTEM-SPECS/requirements-reference.txt'
              assert allowed,'unapproved snapshot path'
              data=base64.b64decode(record['data'],validate=True)
              assert hashlib.sha256(data).hexdigest()==record['sha256'],'file checksum'
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==record['git_blob_sha'],'git blob'
              seen.add(name);validated.append((path,data))
          assert validated,'empty snapshot'
          root=Path(os.environ['RUNNER_TEMP'])/'firm-secure-snapshot'
          assert not root.exists(),'refuse existing snapshot directory'
          root.mkdir(parents=True)
          for path,data in validated:
              target=root/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          meta=dict(source_sha='507ed7d53feb4d580cd1fda3c91ba047c9dffa27',source_bundle_sha256='db1b138c877a25453be28fc56bd43e74aa899108f6d0e90515f0fd2b82d09db4',files=len(validated),workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],scope='embedded experimental snapshot, not formal tapeout source/physical acceptance')
          (root/'provenance.json').write_text(json.dumps(meta,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('FIRM_SNAPSHOT='+str(root)+'\n')
          print(json.dumps(meta))
      - name: Capture tool versions and install fixture dependency
        run: |
          iverilog -V > "$FIRM_SNAPSHOT/iverilog-version.txt" 2>&1
          yosys -V > "$FIRM_SNAPSHOT/yosys-version.txt"
          python3 -m pip install -r "$FIRM_SNAPSHOT/FIRM-SYSTEM-SPECS/requirements-reference.txt"
      - name: Icarus matrices and defect controls
        if: matrix.gate == 'simulation'
        run: |
          set -euo pipefail
          cd "$FIRM_SNAPSHOT"
          python3 -B experimental/i2c/check_wake.py --output reports/wake
          python3 -B experimental/i2c/check_read_checked.py --output reports/checked-read
          python3 -B experimental/i2c/check_command.py --output reports/command
          python3 -B experimental/i2c/check_producer.py --output reports/producer
          python3 -B experimental/i2c/check_command.py --producer --output reports/typed-command
          python3 -B experimental/i2c/check_typed_owner.py --output reports/typed-owner
          python3 -B experimental/i2c/check_session.py --output reports/session
          python3 -B experimental/i2c/check_digest_lookup.py --output reports/digest-lookup
          python3 -B experimental/i2c/check_public_digest_bank.py --output reports/public-bank
          python3 -B experimental/i2c/check_counter_pair.py --output reports/counter-pair
          python3 -B experimental/i2c/check.py --output reports/byte-direct
          python3 -B experimental/i2c/check_transaction.py --output reports/transaction-direct
          for bound in counter reset faults; do
            python3 -B experimental/i2c/check_bounds.py --bench "$bound" --output "reports/bounds-$bound"
          done
      - name: Verify complete counter regression count
        if: matrix.gate == 'simulation'
        run: |
          set -euo pipefail
          cd "$FIRM_SNAPSHOT"
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          groups={}
          for path in Path('reports').glob('*/results.json'):
              result=json.loads(path.read_text())
              rows=result['results'] if 'results' in result else [result]
              assert rows and all(row['result']=='PASS' for row in rows),str(path)
              groups[path.parent.name]=dict(outcomes=len(rows),sha256=hashlib.sha256(path.read_bytes()).hexdigest())
          expected={'wake':14,'checked-read':16,'command':16,'producer':12,'typed-command':19,'typed-owner':14,'session':21,'digest-lookup':9,'public-bank':4,'counter-pair':8,'byte-direct':8,'transaction-direct':8,'bounds-counter':1,'bounds-reset':1,'bounds-faults':1}
          assert {name:value['outcomes'] for name,value in groups.items()}==expected,groups
          report=dict(expected_outcomes=sum(expected.values()),groups=groups,scope='digital regression including expected defect controls; not formal equivalence or hardware timing')
          Path('reports/counter-regression-summary.json').write_text(json.dumps(report,indent=2)+'\n')
          print('BEGIN_COUNTER_REGRESSION_SUMMARY');print(json.dumps(report));print('END_COUNTER_REGRESSION_SUMMARY')
          PY
      - name: Yosys generic synthesis and structural checks
        if: matrix.gate == 'synthesis'
        run: |
          set -euo pipefail
          cd "$FIRM_SNAPSHOT"
          for top in session typed_owner command producer wake checked_read response transaction; do
            python3 -B experimental/i2c/synthesize.py --top "$top" --output "reports/synthesis-$top"
          done
      - name: Measure flattened session generic cells
        if: matrix.gate == 'synthesis'
        run: |
          set -euo pipefail
          cd "$FIRM_SNAPSHOT"
          yosys -p 'read_json reports/synthesis-session/netlist.json; hierarchy -check -top atecc_proof_session; flatten; opt_clean; check -assert; stat; write_json reports/session-flat.json' > reports/session-flatten.log
          python3 - <<'PY'
          import hashlib,json
          from collections import Counter
          from pathlib import Path
          path=Path('reports/session-flat.json')
          data=json.loads(path.read_text());top=data['modules']['atecc_proof_session']
          counts=Counter(c['type'] for c in top.get('cells',{}).values())
          assert not (set(counts)&set(data['modules'])), 'hierarchical cells remain'
          result=dict(result='MEASURED_FLATTENED_GENERIC_CELLS',cell_count=sum(counts.values()),cell_types=dict(sorted(counts.items())),generic_ff_cells=sum(n for t,n in counts.items() if 'DFF' in t),netlist_sha256=hashlib.sha256(path.read_bytes()).hexdigest(),scope='unmapped generic cells; NOT SKY130 area, tile fit, 40MHz timing or physical signoff')
          Path('reports/session-cell-summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Measure request-initialized counters SKY130 footprint
        if: matrix.gate == 'synthesis'
        run: |
          set -euo pipefail
          cd "$FIRM_SNAPSHOT"
          python3 - <<'PY'
          import base64,json,subprocess,hashlib,os,decimal
          from pathlib import Path
          Path('sky130_area.py').write_bytes(base64.b64decode('',validate=True))
          import sky130_area as a
          Path('pdk').mkdir()
          for name,(path,size,blob) in a.FILES.items():
              subprocess.run(['curl','--fail','--location','--retry','3','--output','pdk/'+name,'https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/'+a.ORFS+'/'+path],check=True)
          files=a.verify_library('pdk')
          subprocess.run(['curl','--fail','--location','--retry','3','--output','pdk/tile_sizes.yaml','https://raw.githubusercontent.com/TinyTapeout/tt-support-tools/'+a.TT+'/tech/sky130A/tile_sizes.yaml'],check=True)
          assert '1x2: "0 0 161.00 225.76"' in Path('pdk/tile_sizes.yaml').read_text()
          tool=subprocess.check_output(['yosys','-V'],text=True).strip()
          assert tool=='Yosys 0.33 (git sha1 2584903a060)',tool
          command='read_json reports/session-flat.json; hierarchy -check -top atecc_proof_session; read_liberty -lib pdk/liberty.lib; dffunmap; dfflibmap -liberty pdk/liberty.lib; abc -liberty pdk/liberty.lib; clean; check -assert; stat -liberty pdk/liberty.lib; write_json reports/session-mapped.json; write_verilog -noexpr -noattr reports/session-mapped.v'
          with Path('reports/sky130-mapping.log').open('w') as log: subprocess.run(['yosys','-p',command],stdout=log,stderr=subprocess.STDOUT,check=True)
          hier=json.loads(Path('reports/synthesis-session/netlist.json').read_text())['modules']
          def instances(name,ancestors=()):
              assert name not in ancestors, 'recursive hierarchy'
              result={'transaction':0,'byte':0,'checker':0}
              for c in hier[name].get('cells',{}).values():
                  t=c['type']
                  for key,needle in [('transaction','firm_i2c_transaction'),('byte','firm_i2c_byte'),('checker','atecc_response_check')]:
                      if needle in t: result[key]+=1
                  if t in hier:
                      for key,value in instances(t,ancestors+(name,)).items(): result[key]+=value
              return result
          resource_counts=instances('atecc_proof_session')
          assert resource_counts=={'transaction':1,'byte':1,'checker':1},resource_counts
          flat=json.loads(Path('reports/session-flat.json').read_text())['modules']['atecc_proof_session']
          generic_ff=sum(1 for c in flat['cells'].values() if 'DFF' in c['type'])
          assert generic_ff==895, 'unexpected public-bank FF count'
          raw=Path('reports/session-mapped.json').read_bytes()
          report=a.measure(json.loads(raw),a.liberty_cells(Path('pdk/liberty.lib').read_text()),a.lef_cells(Path('pdk/cells.lef').read_text()),generic_ff)
          meta=json.loads(Path('provenance.json').read_text())
          assert meta["source_sha"]=='507ed7d53feb4d580cd1fda3c91ba047c9dffa27'
          report.update(provenance=meta,library=files,orfs_commit=a.ORFS,tile_source_commit=a.TT,tile_1x2_total_um2='36347.36',baseline_area_um2='41922.7072',baseline_ff=894,generic_ff_cells=generic_ff,resource_counts=resource_counts,mapped_netlist_sha256=a.sha(raw),generic_netlist_sha256=a.sha(Path('reports/session-flat.json').read_bytes()),workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],scope='experimental session only; measured cell area, no equivalence, STA, placement or signoff')
          report['exceeds_total_tile']=float(report['area_um2'])>36347.36
          Path('reports/counter-area.json').write_text(json.dumps(report,indent=2)+'\n')
          print('BEGIN_COUNTER_AREA_EVIDENCE');print(json.dumps(report));print('END_COUNTER_AREA_EVIDENCE')
          assert decimal.Decimal(report['area_um2']) < decimal.Decimal('41922.7072'), 'no measured area reduction'
          PY
      - name: Preserve source provenance and executed reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-secure-${{ matrix.gate }}
          path: ${{ runner.temp }}/firm-secure-snapshot/
          if-no-files-found: error
