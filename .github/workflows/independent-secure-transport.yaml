name: independent-secure-transport
on:
  push:
    paths:
      - '.github/workflows/independent-secure-transport.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        gate: [simulation, synthesis]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install independent HDL tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Verify and materialize pinned experimental source
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path,PurePosixPath
          payload=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(payload).hexdigest()=='02592fc9e933f4dd11e895c34d217dcf115be6206789965c622228c278398ad6','bundle checksum'
          manifest=json.loads(payload)
          assert manifest['format']==1 and manifest['source_sha']=='3ea22602aee024c7d2ba85a89d59ecc91dae8c17','source identity'
          validated=[];seen=set()
          for record in manifest['files']:
              name=record['path'];path=PurePosixPath(name)
              assert name==path.as_posix() and not path.is_absolute() and '..' not in path.parts,'unsafe path'
              assert name not in seen,'duplicate path'
              allowed=(path.parts[:2]==('experimental','i2c') and len(path.parts)==3 and path.suffix in ('.v','.py')) or name in ('FIRM-SYSTEM-SPECS/tools/atecc608_codec.py', 'FIRM-SYSTEM-SPECS/tools/auth_transcript.py', 'FIRM-SYSTEM-SPECS/tools/proof_signature.py', 'FIRM-SYSTEM-SPECS/tools/protocol.py') or name=='FIRM-SYSTEM-SPECS/requirements-reference.txt'
              assert allowed,'unapproved snapshot path'
              data=base64.b64decode(record['data'],validate=True)
              assert hashlib.sha256(data).hexdigest()==record['sha256'],'file checksum'
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==record['git_blob_sha'],'git blob'
              seen.add(name);validated.append((path,data))
          assert validated,'empty snapshot'
          root=Path(os.environ['RUNNER_TEMP'])/'firm-secure-snapshot'
          assert not root.exists(),'refuse existing snapshot directory'
          root.mkdir(parents=True)
          for path,data in validated:
              target=root/path;target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
          meta=dict(source_sha='3ea22602aee024c7d2ba85a89d59ecc91dae8c17',source_bundle_sha256='02592fc9e933f4dd11e895c34d217dcf115be6206789965c622228c278398ad6',files=len(validated),workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],scope='embedded experimental snapshot, not formal tapeout source/physical acceptance')
          (root/'provenance.json').write_text(json.dumps(meta,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as stream:stream.write('FIRM_SNAPSHOT='+str(root)+'\n')
          print(json.dumps(meta))
      - name: Capture tool versions and install fixture dependency
        run: |
          iverilog -V > "$FIRM_SNAPSHOT/iverilog-version.txt" 2>&1
          yosys -V > "$FIRM_SNAPSHOT/yosys-version.txt"
          python3 -m pip install -r "$FIRM_SNAPSHOT/FIRM-SYSTEM-SPECS/requirements-reference.txt"
      - name: Icarus matrices and defect controls
        if: matrix.gate == 'simulation'
        run: |
          set -euo pipefail
          cd "$FIRM_SNAPSHOT"
          python3 -B experimental/i2c/check_wake.py --output reports/wake
          python3 -B experimental/i2c/check_read_checked.py --output reports/checked-read
          python3 -B experimental/i2c/check_command.py --output reports/command
          python3 -B experimental/i2c/check_producer.py --output reports/producer
          python3 -B experimental/i2c/check_command.py --producer --output reports/typed-command
          python3 -B experimental/i2c/check_typed_owner.py --output reports/typed-owner
          python3 -B experimental/i2c/check_session.py --output reports/session
      - name: Yosys generic synthesis and structural checks
        if: matrix.gate == 'synthesis'
        run: |
          set -euo pipefail
          cd "$FIRM_SNAPSHOT"
          for top in session typed_owner command producer wake checked_read response transaction; do
            python3 -B experimental/i2c/synthesize.py --top "$top" --output "reports/synthesis-$top"
          done
      - name: Measure flattened session generic cells
        if: matrix.gate == 'synthesis'
        run: |
          set -euo pipefail
          cd "$FIRM_SNAPSHOT"
          yosys -p 'read_json reports/synthesis-session/netlist.json; hierarchy -check -top atecc_proof_session; flatten; opt_clean; check -assert; stat; write_json reports/session-flat.json' > reports/session-flatten.log
          python3 - <<'PY'
          import hashlib,json
          from collections import Counter
          from pathlib import Path
          path=Path('reports/session-flat.json')
          data=json.loads(path.read_text());top=data['modules']['atecc_proof_session']
          counts=Counter(c['type'] for c in top.get('cells',{}).values())
          assert not (set(counts)&set(data['modules'])), 'hierarchical cells remain'
          result=dict(result='MEASURED_FLATTENED_GENERIC_CELLS',cell_count=sum(counts.values()),cell_types=dict(sorted(counts.items())),generic_ff_cells=sum(n for t,n in counts.items() if 'DFF' in t),netlist_sha256=hashlib.sha256(path.read_bytes()).hexdigest(),scope='unmapped generic cells; NOT SKY130 area, tile fit, 40MHz timing or physical signoff')
          Path('reports/session-cell-summary.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result))
          PY
      - name: Preserve source provenance and executed reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: independent-secure-${{ matrix.gate }}
          path: ${{ runner.temp }}/firm-secure-snapshot/
          if-no-files-found: error
