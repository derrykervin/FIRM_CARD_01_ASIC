name: owner-digest-share-validation
on:
  push:
    paths:
      - '.github/workflows/owner-digest-share-validation.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mailbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        gate: [simulation, synthesis]
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install independent tools
        run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - name: Materialize exact frozen mailbox sources
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(raw).hexdigest()=='cabcab241f8bab054da896336b96ea34085a8b3d3057deb111c4573b4b27647b'
          payload=json.loads(raw);assert payload['source_sha']=='12ab39f6e41bec7543bfee595221810d83d3d3a7'
          files=payload['files'];assert len(files)==52 and {f['path'] for f in files}==set(('src/card_cpu.v', 'src/uart_tx.v', 'src/uart_rx.v', 'src/spi_master.v', 'src/program_rom.v', 'experimental/i2c/firm_i2c_byte.v', 'experimental/i2c/firm_i2c_transaction.v', 'experimental/i2c/atecc_response_check.v', 'experimental/i2c/atecc_read_checked.v', 'experimental/i2c/atecc_command_producer.v', 'experimental/i2c/atecc_command_exchange.v', 'experimental/i2c/atecc_typed_exchange.v', 'experimental/i2c/atecc_wake.v', 'experimental/i2c/atecc_proof_session.v', 'experimental/secure_mailbox/firm_secure_mailbox.v', 'experimental/secure_mailbox/firm_secure_endpoint.v', 'experimental/secure_mailbox/firm_secure_cpu_port.v', 'experimental/secure_mailbox/firm_card_candidate.v', 'experimental/secure_mailbox/firm_card_peripherals.v', 'experimental/secure_mailbox/firm_serial_request_guard.v', 'experimental/secure_mailbox/tb_serial_secure.v', 'experimental/secure_mailbox/check_serial_path.py', 'experimental/secure_mailbox/generate_serial_rom.py', 'experimental/secure_mailbox/serial_records.py', 'experimental/secure_mailbox/test_serial_records.py', 'experimental/i2c/generate_session_vectors.py', 'FIRM-SYSTEM-SPECS/tools/atecc608_codec.py', 'FIRM-SYSTEM-SPECS/tools/auth_transcript.py', 'FIRM-SYSTEM-SPECS/tools/proof_signature.py', 'FIRM-SYSTEM-SPECS/tools/protocol.py', 'FIRM-SYSTEM-SPECS/requirements-reference.txt', 'experimental/secure_mailbox/tb_guarded_serial.v', 'experimental/secure_mailbox/check_request_guard.py', 'experimental/secure_mailbox/tb_request_guard.v', 'experimental/secure_mailbox/check_guard_boundaries.py', 'experimental/secure_mailbox/firm_serial_rom.v', 'experimental/secure_mailbox/firm_current_budget.v', 'experimental/secure_mailbox/tb_current_budget.v', 'experimental/secure_mailbox/check_current_budget.py', 'tools/materialize_serial_rom.py', 'tools/current_budget_checks.py', 'tools/measure_current_budget.py', 'tools/sky130_area.py', 'tools/test_current_budget_checks.py', 'experimental/secure_mailbox/tb_owner_digest_shared.v', 'experimental/secure_mailbox/check_owner_digest_shared.py', 'experimental/secure_mailbox/tb_secure_endpoint.v', 'experimental/secure_mailbox/check_endpoint.py', 'experimental/i2c/check_session.py', 'experimental/i2c/tb_proof_session.v', 'experimental/i2c/tb_session_bounds.v', 'tools/compare_owner_digest_budget.py'))
          validated=[]
          for f in files:
              data=base64.b64decode(f['data'],validate=True)
              assert hashlib.sha256(data).hexdigest()==f['sha256']
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==f['git_blob']
              validated.append((f['path'],data))
          root=Path(os.environ['RUNNER_TEMP'])/'firm-mailbox'
          assert not root.exists(),'refuse existing snapshot'
          root.mkdir()
          for name,data in validated:
              p=root/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          meta=dict(source_sha='12ab39f6e41bec7543bfee595221810d83d3d3a7',bundle_sha256='cabcab241f8bab054da896336b96ea34085a8b3d3057deb111c4573b4b27647b',workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],scope='Owner-held digest direct mode vs captured copy; matched source, strict0.33 budgets, no product/physical acceptance')
          (root/'provenance.json').write_text(json.dumps(meta,indent=2)+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('FIRM_MAILBOX='+str(root)+'\n')
      - name: Compare owner-shared and captured instances plus lifecycle fallback tests
        if: matrix.gate == 'simulation'
        run: |
          set -euo pipefail
          cd "$FIRM_MAILBOX"
          mkdir -p reports
          iverilog -V > reports/iverilog-version.txt 2>&1
          yosys -V > reports/yosys-version.txt
          python3 -m pip install -r FIRM-SYSTEM-SPECS/requirements-reference.txt
          python3 -B tools/materialize_serial_rom.py --check --report reports/rom-verification.json
          python3 -B tools/test_current_budget_checks.py
          python3 -B experimental/secure_mailbox/check_owner_digest_shared.py --output reports/rtl
          python3 -B experimental/secure_mailbox/check_guard_boundaries.py --output reports/boundaries
          python3 -B experimental/secure_mailbox/check_endpoint.py --output reports/endpoint
          python3 -B experimental/i2c/check_session.py --output reports/standalone
          python3 -B experimental/secure_mailbox/test_serial_records.py --replay reports/rtl --terminal-count 15 --groups 6
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/rtl/results.json').read_text())
          assert r['positive_scenarios']==126 and r['expected_outcomes']==9
          assert [(v['cpb'],v['divider'],v['control']) for v in r['results']]==[(8,1,'normal'),(16,2,'normal'),(347,8,'normal'),(434,100,'normal'),(16,2,'captured_child_fallback'),(16,2,'separate_transport_fallback'),(16,2,'direct_zero'),(16,2,'reference_no_capture'),(16,2,'owner_drift_checker')]
          assert all(v['result']=='PASS' for v in r['results'])
          b=json.loads(Path('reports/boundaries/results.json').read_text())
          assert b['positive_cases']==8 and b['expected_outcomes']==4 and all(v['result']=='PASS' for v in b['results'])
          e=json.loads(Path('reports/endpoint/results.json').read_text());assert e['positive_scenarios']==76 and e['expected_outcomes']==8 and all(v['result']=='PASS' for v in e['results'])
          s=json.loads(Path('reports/standalone/results.json').read_text());assert len(s['results'])==21 and all(v['result']=='PASS' for v in s['results'])
          print('BEGIN_OWNER_DIGEST_REGRESSION');print(json.dumps(r));print('END_OWNER_DIGEST_REGRESSION')
          PY
      - name: Compare duplicated and shared bank under locked baseline and full FF retention
        if: matrix.gate == 'synthesis'
        run: |
          set -euo pipefail
          cd "$FIRM_MAILBOX"
          mkdir -p reports
          python3 -B tools/materialize_serial_rom.py --check --report reports/rom-verification.json
          python3 -B tools/test_current_budget_checks.py
          python3 -B tools/compare_owner_digest_budget.py --locked --output reports/owner-sharing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owner-digest-share-${{ matrix.gate }}
          path: ${{ runner.temp }}/firm-mailbox/
          if-no-files-found: error
