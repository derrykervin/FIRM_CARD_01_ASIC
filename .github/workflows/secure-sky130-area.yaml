name: secure-sky130-area
on:
  push:
    paths: ['.github/workflows/secure-sky130-area.yaml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  map-area:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download fixed independent synthesis artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          github-token: ${{ github.token }}
          run-id: 42467377344
          name: independent-secure-synthesis
          path: input
      - name: Materialize measurement scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          files={'sky130_area.py': '', 'test_sky130_area.py': ''}
          for name,data in files.items(): Path(name).write_bytes(base64.b64decode(data,validate=True))
          PY
      - name: Install pinned Yosys and fetch pinned technology inputs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y yosys=0.33-5build2
          mkdir -p pdk reports
          yosys -V | tee reports/yosys-version.txt
          dpkg-query -W yosys | tee reports/package-version.txt
          python3 - <<'PY'
          import subprocess
          import sky130_area as a
          for name,(path,size,blob) in a.FILES.items():
              subprocess.run(['curl','--fail','--location','--retry','3','--output','pdk/'+name,'https://raw.githubusercontent.com/The-OpenROAD-Project/OpenROAD-flow-scripts/'+a.ORFS+'/'+path],check=True)
          subprocess.run(['curl','--fail','--location','--retry','3','--output','pdk/tile_sizes.yaml','https://raw.githubusercontent.com/TinyTapeout/tt-support-tools/'+a.TT+'/tech/sky130A/tile_sizes.yaml'],check=True)
          PY
          python3 sky130_area.py verify > reports/input-verification.json
          python3 -B -m unittest test_sky130_area -v 2>&1 | tee reports/measurement-controls.log
      - name: Map all flattened session cells to SKY130 HD
        shell: bash
        run: |
          set -euo pipefail
          yosys -p 'read_json input/reports/session-flat.json; hierarchy -check -top atecc_proof_session; read_liberty -lib pdk/liberty.lib; dffunmap; dfflibmap -liberty pdk/liberty.lib; abc -liberty pdk/liberty.lib; clean; check -assert; stat -liberty pdk/liberty.lib; write_json mapped.json; write_verilog -noexpr -noattr mapped.v' 2>&1 | tee reports/sky130-mapping.log
          python3 sky130_area.py measure --out reports/area.json
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          files={p.as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in [Path('mapped.json'),Path('mapped.v'),*Path('reports').glob('*'),*Path('pdk').glob('*')] if p.is_file()}
          Path('reports/output-manifest.json').write_text(json.dumps(dict(workflow_sha=os.environ['GITHUB_SHA'],run_id=os.environ['GITHUB_RUN_ID'],files=files,scope='mapping/area only; no STA or physical signoff'),indent=2)+'\n')
          PY
      - name: Preserve exact mapped outputs, inputs and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: secure-sky130-area
          path: |
            reports/
            pdk/
            mapped.json
            mapped.v
            sky130_area.py
            test_sky130_area.py
            input/provenance.json
          if-no-files-found: error
